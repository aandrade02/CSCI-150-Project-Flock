services:
  flocklite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_MOCK=true
      - VITE_API_BASE_URL=/api/v1
      - VITE_BACKEND_PROXY_TARGET=http://flocklite-backend:8000
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
