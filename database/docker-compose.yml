services:
  db:
    image: postgres:16-alpine
    container_name: flocklite-db
    environment:
      POSTGRES_DB: ${DB_NAME:-operation_flock}
      POSTGRES_USER: ${DB_USER:-flockuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flockpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flockuser} -d ${DB_NAME:-operation_flock}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flocklite-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flocklite-backend
    ports:
      - "800:800"
    environment:
      - DB_NAME=${DB_NAME:-operation_flock}
      - DB_USER=${DB_USER:-flockuser}
      - DB_PASSWORD=${DB_PASSWORD:-flockpassword}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ALLOWED_HOSTS=*
      - PORT=800
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dev:/app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: flocklite-network

